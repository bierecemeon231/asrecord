name: Build Windows Executable

on:
  push:
    branches: [ main ] # Tự động chạy khi bạn push code lên nhánh main
  workflow_dispatch:   # Cho phép bấm nút Build thủ công trên GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Electron Executable
        run: npm run build

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Windows-EXE
          path: dist/*.exe
